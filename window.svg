 "extractedAt": "2026-08-04",
 "articles": [
  {
   "id": "artigo-1",
   "label": "Artigo 1.º",
   "epigraph": "Base do Imposto",
   "path": [
    "CAPÍTULO I - Da Incidência"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. O Imposto sobre os Rendimentos do Trabalho incide sobre os rendimentos por conta própria ou por conta de outrem, expressos em dinheiro, ainda que auferido em espécie, de natureza contratual ou não contratual, periódicos ou ocasionais, fixos ou variáveis, independentemente da sua proveniência, local, moeda, forma estipulada para o seu cálculo e pagamento."
    },
    {
     "t": "p",
     "x": "2. Constituem rendimentos para efeitos deste imposto, todas as remunerações percebidas a título de ordenados, vencimentos, salários, honorários, avenças, gratificações, subsídios, prémios, comissões, senhas de presença, emolumentos, participações em multas, custas, margens, os rendimentos comerciais e industriais, bem como outras remunerações acessórias, sem prejuízo do disposto no artigo 2.º do presente Código."
    },
    {
     "t": "p",
     "x": "3. Consideram-se também rendimentos do trabalho:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Os abonos para falhas, os subsídios diários de representação, de viagens ou deslocações e quaisquer outras importâncias da mesma natureza, sem prejuízo do disposto nas alíneas c) e j) do artigo seguinte;",
      "As remunerações dos detentores de participações sociais pelo desempenho de trabalho nas respectivas sociedades;",
      "As remunerações dos membros dos órgãos estatutários das pessoas colectivas e entidades equiparadas;",
      "Os aumentos patrimoniais e despesas efectivamente realizadas sem a devida comprovação da origem do rendimento;",
      "As remunerações pagas por partidos políticos e outras organizações de carácter político ou social."
     ]
    }
   ]
  },
  {
   "id": "artigo-2",
   "label": "Artigo 2.º",
   "epigraph": "Não sujeição",
   "path": [
    "CAPÍTULO I - Da Incidência"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Não constituem matéria colectável:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "As prestações sociais pagas pelo Instituto Nacional da Segurança Social, no âmbito da protecção social obrigatória, nos termos da lei;",
      "As gratificações de fim de carreira devidas no âmbito da relação jurídico-laboral;",
      "Os abonos para falhas, em montante que não ultrapassem o limite máximo estabelecido para os funcionários públicos;",
      "O abono de família, pago pela entidade empregadora, em montante que não ultrapasse o limite máximo de 5% (cinco por cento) do ordenado base mensal do trabalhador, excluídos os trabalhadores sujeitos ao regime remuneratório da função pública;",
      "As contribuições para a segurança social;",
      "Os subsídios de renda de casa até ao limite de 50% (cinquenta por cento) do valor do contrato de arrendamento, excluídos os trabalhadores sujeitos ao regime remuneratório da função pública;",
      "As compensações pagas a trabalhadores por rescisão contratual independentemente de causa objectiva, que não ultrapassem os limites máximos previstos na Lei Geral do Trabalho;",
      "Os salários e outras remunerações devidas aos trabalhadores eventuais agrícolas e aos trabalhadores domésticos contratados directamente por pessoas singulares ou agregados familiares;",
      "Os subsídios atribuídos por lei aos cidadãos nacionais portadores de deficiências motoras, sensoriais e mentais;",
      "Os subsídios diários, os subsídios de representação, os subsídios de viagem e deslocação atribuídos aos funcionários do Estado, que não ultrapassem os limites estabelecidos na legislação específica;",
      "Os subsídios diários de alimentação e transporte, atribuídos a trabalhadores dependentes não incluídos na alínea j), até ao limite de Kz. 30.000.00 (trinta mil Kwanzas) do seu valor mensal global;",
      "O reembolso de despesas incorridas pelos trabalhadores dependentes de entidades sujeitas a imposto industrial ou a outros regimes especiais de tributação, quando deslocados ao serviço da entidade patronal, desde que estas despesas se encontrem devidamente documentadas nos termos do Código do Imposto Industrial e legislação complementar;",
      "As gratificações de férias e o subsídio de natal até o limite de 100% (cem por cento) do salário base do trabalhador."
     ]
    },
    {
     "t": "p",
     "x": "2. Para efeitos da alínea c) do n.º 1 do presente artigo, entende-se por abonos para falhas o complemento remuneratório acessório que a entidade patronal paga aos seus trabalhadores, pelos riscos inerentes ao exercício de funções que, pela sua natureza, sejam susceptíveis de gerar falhas contabilísticas em operações de tesouraria, pelas quais possam ser directamente responsabilizadas."
    },
    {
     "t": "p",
     "x": "3. Para efeitos do disposto na alínea f) do n.º 1 do presente artigo devem os interessados fazer a entrega de cópia do contrato de arrendamento na Repartição Fiscal competente, no prazo de 15 (quinze) dias a partir da data da assinatura do contrato;"
    },
    {
     "t": "p",
     "x": "4. Na falta da entrega do contrato nos termos do número anterior, os montantes atribuídos ao trabalhador a título de subsídio de renda de casa constituem matéria colectável na sua totalidade."
    }
   ]
  },
  {
   "id": "artigo-3",
   "label": "Artigo 3.º",
   "epigraph": "Grupos de tributação",
   "path": [
    "CAPÍTULO I - Da Incidência"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Os rendimentos do Imposto sobre os Rendimentos do Trabalho dividem-se em 3 (Três) Grupos de tributação, A, B e C."
    },
    {
     "t": "p",
     "x": "2. No Grupo A incluem-se todas as remunerações percebidas pelos trabalhadores por conta de outrem e pagas por uma entidade patronal por força de vínculo laboral como definido nos termos da Lei Geral do Trabalho e os rendimentos dos trabalhadores cujo vínculo de emprego se encontra regulado pelo regime jurídico da função pública."
    },
    {
     "t": "p",
     "x": "3. No Grupo B incluem-se todas as remunerações percebidas pelos trabalhadores por conta própria que desempenhem, de forma independente, actividades constantes da lista de profissões anexa ao presente Código, e os rendimentos auferidos por titulares de cargos de gerência ou administração ou por titulares de órgãos sociais de sociedades."
    },
    {
     "t": "p",
     "x": "4. No Grupo C todas as remunerações percebidas pelo desempenho de actividades industriais e comerciais, que se presumem, todas as constantes na tabela de lucros mínimos em vigor."
    }
   ]
  },
  {
   "id": "artigo-4",
   "label": "Artigo 4.º",
   "epigraph": "Incidência subjectiva e âmbito de sujeição",
   "path": [
    "CAPÍTULO I - Da Incidência"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. O imposto é devido pelas pessoas singulares, quer residam, quer não, em território nacional, cujos rendimentos sejam obtidos por serviços prestados, directa ou indirectamente, a pessoas singulares ou colectivas com domicílio, sede, direcção efectiva ou estabelecimento estável no País."
    },
    {
     "t": "p",
     "x": "2. Consideram-se sempre obtidos no País os rendimentos derivados de:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Actividades dos tripulantes de navios ou aeronaves pertencentes a empresas que possuam no território nacional sede, direcção efectiva ou estabelecimento estável;",
      "Actividade dos titulares de cargos de gerência, administração, e órgãos sociais de sociedades que tenham a sua sede, direcção efectiva ou estabelecimento estável no território nacional."
     ]
    }
   ]
  },
  {
   "id": "artigo-5",
   "label": "Artigo 5.º",
   "epigraph": "Rendimentos isentos",
   "path": [
    "CAPÍTULO II - Das Isenções"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Estão isentos de Imposto sobre os Rendimentos do Trabalho:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Os rendimentos auferidos pelos agentes das missões diplomáticas e consulares estrangeiras sempre que haja reciprocidade de tratamento;",
      "Os rendimentos auferidos por pessoal dos serviços de organizações internacionais, nos termos estabelecidos em acordos ratificados pelo órgão competente do Estado;",
      "Os rendimentos auferidos pelo pessoal ao serviço das organizações não governamentais, nos termos estabelecidos nos acordos com entidades nacionais, com o reconhecimento prévio por escrito do Director Nacional de Impostos;",
      "Os rendimentos auferidos pelos deficientes físicos e mutilados de guerra, cujo grau de invalidez ou incapacidade seja igual ou superior a 50% (cinquenta por cento), comprovada com a apresentação pelo contribuinte de documentação emitida por autoridade competente para o efeito;",
      "Os rendimentos auferidos pelos cidadãos nacionais com idade superior a 60 (sessenta) anos derivados do trabalho por conta de outrem;",
      "Os rendimentos decorrentes do exercício das actividades previstas nos Grupos de tributação A e B auferidos pelos antigos combatentes, deficientes de guerra e familiares de combatente tombado ou perecido, desde que devidamente registados no Departamento Ministerial de tutela."
     ]
    }
   ]
  },
  {
   "id": "artigo-6",
   "label": "Artigo 6.º",
   "epigraph": "Isenções específicas",
   "path": [
    "CAPÍTULO II - Das Isenções"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "São isentos de impostos os rendimentos auferidos por pessoas singulares que prestem serviço militar e paramilitar nos órgãos de Defesa e Ordem Interna, mas apenas aqueles derivados dessa prestação."
    }
   ]
  },
  {
   "id": "artigo-7",
   "label": "Artigo 7.º",
   "epigraph": "Determinação da matéria colectável dos rendimentos do Grupo A",
   "path": [
    "CAPÍTULO III - Da Determinação da Matéria Colectável"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. A matéria colectável dos rendimentos do Grupo A é constituída por todas as remunerações expressas em dinheiro, ainda que auferida em espécie, de natureza contratual ou não contratual, periódicas ou ocasionais, fixas ou variáveis, independentemente da sua proveniência, local, moeda, forma estipulada para o seu cálculo e pagamento, auferidas pelos trabalhadores por conta de outrem."
    },
    {
     "t": "p",
     "x": "2. A determinação da matéria colectável dos rendimentos do Grupo A faz-se, pela seguinte ordem:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Dedução à retribuição global das contribuições obrigatórias para a Segurança Social;",
      "Dedução das componentes remuneratórias não sujeitas ou isentas, nos termos do presente Código."
     ]
    },
    {
     "t": "p",
     "x": "3. Não é aceite a transferência do encargo fiscal do trabalhador para a esfera da entidade patronal, não podendo ser atribuído ao trabalhador rendimento líquido disponível superior ao valor constante do seu contrato de trabalho a título de remuneração, circunstância que a verificar-se importa pena de multa, nos termos do Código Geral Tributário, bem como a liquidação adicional do imposto devido."
    }
   ]
  },
  {
   "id": "artigo-8",
   "label": "Artigo 8.º",
   "epigraph": "Determinação da matéria colectável dos rendimentos do Grupo B",
   "path": [
    "CAPÍTULO III - Da Determinação da Matéria Colectável"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. O rendimento colectável dos contribuintes do Grupo B apura-se nos seguintes termos:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Quanto aos rendimentos pagos por pessoas colectivas ou singulares com contabilidade organizada, a matéria colectável corresponde a 70% (setenta por cento) do valor pago;",
      "Quanto aos rendimentos pagos por entidades que não se enquadrem na alínea anterior, a matéria colectável apura-se com base na contabilidade ou registos contabilísticos do sujeito passivo ou com base nos registos disponíveis sobre compras e vendas e serviços prestados, ou ainda com base nos dados que a administração fiscal disponha."
     ]
    },
    {
     "t": "p",
     "x": "2. No apuramento do rendimento colectável dos trabalhadores por conta própria nos termos da alínea b) do número anterior, são deduzidos os seguintes encargos:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Renda de instalação;",
      "Remuneração do pessoal permanente não superior a 3 (três);",
      "Consumo de água e energia eléctrica;",
      "Comunicações;",
      "Seguros com o exercício da actividade;",
      "Trabalhos laboratoriais efectuados em estabelecimentos diferenciados dos que estejam afectados ao exercício da actividade profissional do contribuinte;",
      "Outras despesas indispensáveis à formação do rendimento, incluídas as verbas para reintegração das instalações."
     ]
    },
    {
     "t": "p",
     "x": "3. É considerado como despesa, para aplicação do número anterior, 30% (Trinta por cento) do rendimento bruto do contribuinte, desde que não possua contabilidade organizada, que a existir apura com base no custo real, até ao limite aqui estabelecido."
    },
    {
     "t": "p",
     "x": "4. Na determinação da matéria colectável dos rendimentos dos titulares dos cargos de gerência e administração ou titulares de órgãos sociais de sociedades não é aplicável o disposto nos números anteriores sobre deduções, devendo a mesma ser determinada nos mesmos termos estabelecidos para o Grupo A."
    }
   ]
  },
  {
   "id": "artigo-9",
   "label": "Artigo 9.º",
   "epigraph": "Determinação da matéria colectável dos rendimentos do Grupo C",
   "path": [
    "CAPÍTULO III - Da Determinação da Matéria Colectável"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. O rendimento colectável dos contribuintes do Grupo C é o constante da Tabela dos Lucros Mínimos."
    },
    {
     "t": "p",
     "x": "2. Sempre que o contribuinte verifique, com base em quaisquer meios, que o seu volume de facturação é 4 (quatro) vezes superior ao valor máximo correspondente, à sua actividade na Tabela dos Lucros Mínimos, a matéria colectável corresponde ao volume de vendas de bens e serviços não sujeitos à retenção na fonte, no decorrer do exercício."
    },
    {
     "t": "p",
     "x": "3. Em caso de incumprimento do disposto no número anterior, a administração fiscal apura o imposto devido nos termos nele previsto, ao qual acresce multa correspondente ao dobro do imposto apurado com base na Tabela dos Lucros Mínimos."
    },
    {
     "t": "p",
     "x": "4. Quando um contribuinte desse grupo preste serviços sujeitos à retenção na fonte, nos termos do Código do Imposto Industrial, a pessoas colectivas ou singulares com contabilidade organizada, a matéria colectável corresponde ao valor do serviço."
    },
    {
     "t": "p",
     "x": "5. Os rendimentos auferidos nos termos do número anterior, não concorrem para a determinação da matéria colectável do n.º 2 do presente artigo."
    }
   ]
  },
  {
   "id": "artigo-10",
   "label": "Artigo 10.º",
   "epigraph": "Método de liquidação do imposto",
   "path": [
    "CAPÍTULO IV - Da Liquidação"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. A liquidação do imposto devido pela atribuição de rendimentos do Grupo A é efectuada pela entidade responsável pelo pagamento destes rendimentos, mensalmente, após a realização das deduções previstas no n.º 2 do artigo 7.º, pela aplicação da tabela de taxas do Imposto sobre os Rendimentos do Trabalho em vigor e preenchimento do Documento de Liquidação de Imposto."
    },
    {
     "t": "p",
     "x": "2. A liquidação do imposto devido pela atribuição de rendimentos do Grupo B é efectuada nos seguintes termos:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Pela entidade pagadora desses rendimentos, mediante retenção na fonte, nos casos referidos na alínea a) do n.º 1 do artigo 8.º;",
      "Pela entidade pagadora desses rendimentos quando atribuídos aos titulares de cargos de gerência ou administração ou titulares de órgãos sociais de sociedades, nos termos do n.º 4 do artigo 8.º;",
      "Pelo contribuinte, nos casos referidos na alínea b) do n.º 1 do artigo 8.º"
     ]
    },
    {
     "t": "p",
     "x": "3. A liquidação do imposto devido pelos contribuintes do Grupo C é efectuada nos seguintes termos:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Pelo contribuinte, nos casos referidos nos n.os 1 e 2 do artigo 9.º do presente Código, no que respeita aos rendimentos auferidos no ano anterior;",
      "Pela entidade pagadora dos rendimentos, mediante retenção na fonte, nos casos referidos no n.º 4 do artigo 9.º do presente Código."
     ]
    }
   ]
  },
  {
   "id": "artigo-11",
   "label": "Artigo 11.º",
   "epigraph": "Pagamento",
   "path": [
    "CAPÍTULO V - Da Entrega do Imposto"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. O imposto devido pela atribuição de rendimentos do Grupo A, deve ser entregue, pela entidade empregadora, até ao final do mês seguinte ao do respectivo pagamento, na Repartição Fiscal competente."
    },
    {
     "t": "p",
     "x": "2. O imposto devido pela atribuição de rendimentos do Grupo B deve ser entregue:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Pela entidade pagadora dos rendimentos, até ao final do mês seguinte ao do pagamento, na Repartição Fiscal competente, quanto aos rendimentos liquidados nos termos da alínea a) do n.º 2 do artigo anterior;",
      "Pela entidade pagadora dos rendimentos, nos precisos termos em que é entregue o imposto devido pela atribuição de rendimentos do Grupo A, quanto aos rendimentos liquidados nos termos da alínea b) do n.º 2 do artigo anterior;",
      "Pelo titular do rendimento, até ao final do mês em que deve ser entregue a declaração anual de rendimentos, quanto aos rendimentos liquidados nos termos da alínea c) do n.º 2 do artigo anterior."
     ]
    },
    {
     "t": "p",
     "x": "3. O imposto devido pela atribuição de rendimentos do Grupo C deve ser entregue:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Pelo titular desses rendimentos, até ao final do mês de Fevereiro, quanto aos rendimentos liquidados nos termos da alínea a) do n.º 3 do artigo anterior;",
      "Pela entidade pagadora dos rendimentos na Repartição Fiscal competente, até ao final do mês seguinte ao do respectivo pagamento, quanto aos rendimentos liquidados nos termos da alínea b) do n º 3 do artigo anterior."
     ]
    },
    {
     "t": "p",
     "x": "4. A entrega do imposto é realizada, nos termos do Código Geral Tributário, através do preenchimento e entrega do respectivo Documento de Liquidação do Imposto."
    }
   ]
  },
  {
   "id": "artigo-12",
   "label": "Artigo 12.º",
   "epigraph": "Apresentação de declarações",
   "path": [
    "CAPÍTULO VI - Das Obrigações Declarativas"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. As entidades responsáveis pela liquidação e entrega do imposto devido pela atribuição de rendimentos do Grupo A, devem entregar no mês de Fevereiro uma declaração anual — Modelo 2, nos termos regulamentares, — em que conste a seguinte informação, discriminada por beneficiário, relativa ao exercício fiscal anterior:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Nome completo e morada do beneficiário do rendimento;",
      "Número de identificação fiscal do beneficiário;",
      "Número de Segurança Social do beneficiário;",
      "Valor global dos rendimentos pagos;",
      "Montante total de imposto pago no exercício anterior."
     ]
    },
    {
     "t": "p",
     "x": "2. As entidades responsáveis pela liquidação e entrega de imposto devido pela atribuição de rendimentos das categorias B e C devem entregar no mês de Fevereiro uma declaração anual — Modelo 2, nos termos regulamentares, em que conste a seguinte informação, discriminada por beneficiário, relativa ao exercício fiscal anterior:"
    },
    {
     "t": "list",
     "style": "alpha",
     "items": [
      "Nome completo e morada do beneficiário dos rendimentos;",
      "Número de identificação fiscal do beneficiário;",
      "Número de Segurança Social do beneficiário;",
      "Valor anual dos rendimentos pagos;",
      "Montante anual de imposto entregue."
     ]
    },
    {
     "t": "p",
     "x": "3. Os titulares de rendimentos do Grupo B, residentes em Angola, devem entregar, até ao final do mês de Março, na Repartição Fiscal da área do seu escritório ou estabelecimento, a Declaração Modelo 1, nos termos regulamentares, em que devem discriminar todas as remunerações auferidas no decurso do ano fiscal anterior."
    },
    {
     "t": "p",
     "x": "4. Os contribuintes abrangidos pelo n.º 2 do artigo 9.º devem entregar, até ao final do mês de Março, na repartição fiscal da área do seu escritório ou estabelecimento, a declaração modelo oficial aprovada por Decreto Executivo do Ministro das Finanças, discriminando as vendas e os serviços prestados e as compras efectuadas e os serviços contratados não sujeitos a retenção, realizados no decurso do ano fiscal anterior."
    },
    {
     "t": "p",
     "x": "5. Na ausência de escritório ou estabelecimento, nos termos do número anterior é competente a repartição fiscal da área do domicílio do titular dos rendimentos."
    },
    {
     "t": "p",
     "x": "6. Os modelos previstos neste artigo, podem ser substituídos pela entrega da informação em suporte digital ou mediante submissão electrónica, nos termos regulamentares."
    }
   ]
  },
  {
   "id": "artigo-13",
   "label": "Artigo 13.º",
   "epigraph": "Correcção das declarações",
   "path": [
    "CAPÍTULO VI - Das Obrigações Declarativas"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. A administração fiscal pode rever e corrigir o valor dos rendimentos declarados pelo contribuinte, ou pela entidade obrigada à retenção na fonte, sempre que, em face dos elementos oferecidos pela fiscalização, ou de quaisquer outros meios de que se disponha, neles reconheça faltas, insuficiências ou inexactidões."
    },
    {
     "t": "p",
     "x": "2. Na falta de declarações, cumpre à Repartição Fiscal competente determinar o rendimento colectável com base nos elementos disponíveis."
    }
   ]
  },
  {
   "id": "artigo-14",
   "label": "Artigo 14.º",
   "epigraph": "Rendimentos em espécie",
   "path": [
    "CAPÍTULO VI - Das Obrigações Declarativas"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Devem acrescer aos rendimentos, para efeitos de determinação da matéria colectável, os valores despendidos para pagamentos em espécie, tais como de géneros alimentares, alojamento e quaisquer outros encargos ou obrigações suportados pela entidade empregadora a favor do contribuinte, salvo as limitações impostas por lei."
    },
    {
     "t": "p",
     "x": "2. As remunerações em espécie são computadas pelo seu custo, determinado prioritariamente pelos elementos constantes dos registos em poder da entidade patronal ou do beneficiário."
    }
   ]
  },
  {
   "id": "artigo-15",
   "label": "Artigo 15.º",
   "epigraph": "Reclamação",
   "path": [
    "CAPÍTULO VI - Das Obrigações Declarativas"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Da fixação da matéria colectável podem os contribuintes reclamar, nos termos do Código Geral Tributário."
    }
   ]
  },
  {
   "id": "artigo-16",
   "label": "Artigo 16.º",
   "epigraph": "Taxas",
   "path": [
    "CAPÍTULO VII - Das Taxas"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. A matéria colectável apurada por atribuição de rendimentos do Grupo A aplicam-se as taxas constantes na tabela anexa ao presente Código."
    },
    {
     "t": "p",
     "x": "2. A matéria colectável apurada por atribuição de rendimentos do Grupo B aplica-se a taxa única de 15% (quinze por cento)."
    },
    {
     "t": "p",
     "x": "3. A matéria colectável do Grupo C, referente aos rendimentos previstos no n.º 1 do artigo 9.º aplica-se a taxa de 30% (trinta por cento)."
    },
    {
     "t": "p",
     "x": "4. O rendimento auferido nos termos dos n.os 2 e 4 do artigo 9.º do presente Código aplica-se a taxa de 6,5 % (seis vírgula cinco por cento )."
    }
   ]
  },
  {
   "id": "artigo-17",
   "label": "Artigo 17.º",
   "epigraph": "Elaboração de mapas mensais",
   "path": [
    "CAPÍTULO VIII - Das Obrigações Acessórias"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Para efeitos de entrega do imposto devido pela atribuição de rendimentos do Grupo A, como definidos nos termos do presente Código, devem os salários ser processados por todas as entidades em mapas de remunerações mensais, sempre que se trate de mais de 3 (três) trabalhadores, neles se incluindo os trabalhadores isentos."
    }
   ]
  },
  {
   "id": "artigo-18",
   "label": "Artigo 18.º",
   "epigraph": "Cessação de actividade",
   "path": [
    "CAPÍTULO VIII - Das Obrigações Acessórias"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. As pessoas que aufiram rendimentos dos Grupos B e C, que cessarem a sua actividade no decorrer do ano, só é exigido o imposto que a esse período corresponder."
    },
    {
     "t": "p",
     "x": "2. Os contribuintes referidos no número anterior devem entregar a Declaração Modelo 3, nos termos regulamentares, na qual informam a Repartição Fiscal competente a respectiva cessação de actividade."
    }
   ]
  },
  {
   "id": "artigo-19",
   "label": "Artigo 19.º",
   "epigraph": "Organização de processo Grupo B e C",
   "path": [
    "CAPÍTULO VIII - Das Obrigações Acessórias"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "A Repartição Fiscal competente deve organizar um processo por cada contribuinte que aufira rendimentos do Grupo B e C, como definidos nos termos do presente Código."
    }
   ]
  },
  {
   "id": "artigo-20",
   "label": "Artigo 20.º",
   "epigraph": "Responsabilidade pela liquidação adicional",
   "path": [
    "CAPÍTULO IX - Da Liquidação Adicional"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Nos casos em que se verificar falta de liquidação do imposto ou em que este tenha sido liquidado por importância inferior à devida, a entidade responsável pela entrega pode, espontaneamente, proceder às liquidações adicionais que se mostrem necessárias, salvo se antes houver sido iniciado procedimento de fiscalização."
    }
   ]
  },
  {
   "id": "artigo-21",
   "label": "Artigo 21.º",
   "epigraph": "Liquidação adicional",
   "path": [
    "CAPÍTULO IX - Da Liquidação Adicional"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Havendo lugar à liquidação adicional, a responsabilidade pelo pagamento do imposto pertence às entidades obrigadas à retenção na fonte, sem prejuízo do direito de regresso que possa caber-lhes, e, subsidiariamente, às pessoas sujeitas a imposto."
    },
    {
     "t": "p",
     "x": "2. Quando a liquidação adicional respeite a imposto liquidado por auto-liquidação, a responsabilidade pelo pagamento do imposto é do beneficiário do rendimento."
    },
    {
     "t": "p",
     "x": "3. No caso da liquidação adicional decorrer de acção de inspecção, o imposto deve ser entregue no prazo de 15 (quinze) dias após a notificação."
    }
   ]
  },
  {
   "id": "artigo-22",
   "label": "Artigo 22.º",
   "epigraph": "Conservação de documentação",
   "path": [
    "CAPÍTULO X - Arquivos"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Os sujeitos passivos e os substitutos tributários do Imposto sobre os Rendimentos do Trabalho são obrigados a conservar toda a documentação contabilística relevante para o correcto apuramento do imposto devido, por um prazo de 5 (cinco) anos."
    },
    {
     "t": "p",
     "x": "2. Pelo mesmo prazo previsto no número anterior, devem ser conservados os documentos e registos que sirvam de suporte às declarações dos contribuintes."
    },
    {
     "t": "p",
     "x": "3. Na escrituração dos registos referidos nos números anteriores, as omissões e informações fraudulentas são punidas com multa, nos termos do Código Geral Tributário e da Legislação Penal vigente."
    }
   ]
  },
  {
   "id": "artigo-23",
   "label": "Artigo 23.º",
   "epigraph": "Inscrição dos titulares dos rendimentos do Grupo B",
   "path": [
    "CAPÍTULO X - Arquivos"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. As pessoas que pretendam exercer actividades profissionais constantes da lista de profissões anexa a este Código devem proceder à sua inscrição no Registo Geral de Contribuintes, antes do início de actividade na Repartição Fiscal competente para a arrecadação do imposto."
    },
    {
     "t": "p",
     "x": "2. O incumprimento da obrigação prevista no número anterior constitui infracção punível, nos termos do Código Geral Tributário."
    }
   ]
  },
  {
   "id": "artigo-24",
   "label": "Artigo 24.º",
   "epigraph": "Actualização de cadastro",
   "path": [
    "CAPÍTULO X - Arquivos"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Os serviços públicos e os demais organismos em que seja obrigatória a inscrição para o exercício de actividades abrangidas pela tabela anexa ao presente Código, devem enviar à Repartição Fiscal da respectiva área, durante o mês de Janeiro de cada ano, uma relação nominal dos associados que estejam em efectivo serviço, com indicação do respectivo domicílio, local do consultório ou escritório e especialidades profissionais."
    }
   ]
  },
  {
   "id": "artigo-25",
   "label": "Artigo 25.º",
   "epigraph": "Reclamação e recurso",
   "path": [
    "CAPÍTULO XI - Garantia dos Contribuintes"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Sempre que o sujeito passivo do imposto ou o seu substituto tributário, pretendam reclamar ou impugnar, actos de liquidação de imposto ou a aplicação de multas derivadas de transgressões administrativas, devem fundamentar a sua pretensão, nos termos previstos no Código Geral Tributário e no Código de Processo Tributário."
    }
   ]
  },
  {
   "id": "artigo-26",
   "label": "Artigo 26.º",
   "epigraph": "Compensação",
   "path": [
    "CAPÍTULO XI - Garantia dos Contribuintes"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Quando nas liquidações de imposto tiverem sido praticados erros de que possa resultar a entrega de imposto em importância superior à devida, o Chefe da Repartição pode, a requerimento do interessado autorizar a entidade obrigada à retenção na fonte a proceder à respectiva compensação por dedução em futuras entregas, a efectuar dentro do mesmo ano económico e do mesmo imposto."
    },
    {
     "t": "p",
     "x": "2. Quando a compensação não possa ser efectuada no mesmo ano económico, extrai-se uma nota de crédito de imposto, que suporte o acerto de contas no exercício seguinte."
    },
    {
     "t": "p",
     "x": "3. O responsável pelo Departamento Ministerial que responde pelas Finanças Públicas aprova por Decreto Executivo, o modelo de nota de crédito de imposto, mencionada no número anterior."
    }
   ]
  },
  {
   "id": "artigo-27",
   "label": "Artigo 27.º",
   "epigraph": "Falta, inexactidão ou omissão da declaração",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "A falta, inexactidão das várias declarações previstas no presente Código e as omissões nelas praticadas são punidas com multa, nos termos do Código Geral Tributário."
    }
   ]
  },
  {
   "id": "artigo-28",
   "label": "Artigo 28.º",
   "epigraph": "Atraso na escrituração e na declaração",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Para os contribuintes dos Grupos B e C, os atrasos superiores a 30 (trinta) dias, contados a partir de 1 de Abril de cada ano, na apresentação da escrita e da declaração, a que se refere o n.º 3 do artigo 22 º do presente Código, são punidos com pena de multa a apurar, nos termos do Código Geral Tributário, no valor mínimo de Kz 50 000,00 (cinquenta mil Kwanzas)."
    },
    {
     "t": "p",
     "x": "2. Vencido o prazo de 30 (trinta) dias previstos no número anterior, a Administração Tributária notifica o contribuinte para regularizar a sua escrita e apresentar a declaração, dentro do prazo dos 30 (Trinta) dias subsequentes, com a cominação de, se o não fizer, fica sujeito à pena de multa adicional de Kz: 100.000,00 (cem mil Kwanzas)."
    },
    {
     "t": "p",
     "x": "3. Se, relativamente ao exercício económico seguinte, o contribuinte não observar os prazos referidos nos números anteriores, é punido com pena de multa no valor de Kz: 300.000,00 (trezentos mil Kwanzas) e Kz: 500.000.00 (quinhentos mil Kwanzas), respectivamente."
    },
    {
     "t": "p",
     "x": "4. As entidades responsáveis pela liquidação e entrega do imposto previstas nos n.os 1 e 2 do artigo 12.º do presente Código, que não apresentem a declaração a que se refere aquelas normas, são punidos com a pena de multa de Kz: 4.000.00 (quatro mil Kwanzas), por cada nome."
    }
   ]
  },
  {
   "id": "artigo-29",
   "label": "Artigo 29.º",
   "epigraph": "Não conservação de documentos",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Não sendo conservados os documentos referidos no artigo 22.º do presente Código, na forma e período nele estabelecido, aplica-se ao contribuinte a pena de multa de Kz: 200.000,00 (duzentos mil Kwanzas)."
    }
   ]
  },
  {
   "id": "artigo-30",
   "label": "Artigo 30.º",
   "epigraph": "Responsabilidade solidária",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "Pelas omissões, inexactidões e outras infracções tributárias eventualmente praticadas, nos termos do presente Código, são responsáveis, solidariamente entre si e com a entidade patronal, os gerentes e administradores das pessoas colectivas de direito privado, bem como gestores das pessoas colectivas de direito público."
    }
   ]
  },
  {
   "id": "artigo-31",
   "label": "Artigo 31.º",
   "epigraph": "Falta de retenção",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. As entidades obrigadas à retenção de imposto na fonte que não cumpram essa obrigação são punidas com pena de multa nos termos do Código Geral Tributário."
    },
    {
     "t": "p",
     "x": "2. A multa a apurar nos termos do número anterior não pode ter um valor inferior a Kz: 50.000,00 (cinquenta mil Kwanzas)."
    }
   ]
  },
  {
   "id": "artigo-32",
   "label": "Artigo 32.º",
   "epigraph": "Incumprimento total ou parcial",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "A falta de entrega do imposto, ou a entrega de quantia inferior à descontada é punida com pena de multa, igual ao dobro do quantitativo do imposto em falta, sem prejuízo de procedimento criminal se se presumir a existência de crime."
    }
   ]
  },
  {
   "id": "artigo-33",
   "label": "Artigo 33.º",
   "epigraph": "Anulações ou rectificações",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "As anulações ou rectificações de liquidações de imposto efectuadas sem observância do disposto no artigo 10.º do presente Código são equiparadas à falta de entrega do imposto e punidas nos termos do artigo anterior."
    }
   ]
  },
  {
   "id": "artigo-34",
   "label": "Artigo 34.º",
   "epigraph": "Redução das multas",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "As penas de multa constantes dos artigos anteriores são sempre reduzidas a metade, quando o cumprimento da obrigação fiscal se efectuar voluntariamente dentro dos 30 (trinta) dias subsequentes àquele em que devesse ter sido feito."
    }
   ]
  },
  {
   "id": "artigo-35",
   "label": "Artigo 35.º",
   "epigraph": "Recibo de remunerações",
   "path": [
    "CAPÍTULO XII - Penalidades"
   ],
   "blocks": [
    {
     "t": "p",
     "x": "1. Cumpre à entidade empregadora a emissão de comprovativos relativos às remunerações pagas e às deduções efectuadas por conta do imposto, através de recibos mensais de remunerações, assinados pela gerência ou administração, ou por um funcionário devidamente mandatado para os representar e aposto carimbo da empresa."
    },
    {
     "t": "p",
     "x": "2. Os recibos mencionados no número anterior podem ser enviados ao trabalhador por via electrónica, quando a empresa e o trabalhador possuam endereço electrónico."
    },
    {
     "t": "p",
     "x": "3. O incumprimento do disposto no número anterior do presente artigo é sancionado nos termos do Código Geral Tributário."
    }
   ]
  },
