 "title": "Código do Imposto sobre os Rendimentos do Trabalho",
 "diploma": "Lei n.º 18/14, de 22 de Outubro",
 "consolidation": "Texto consolidado tal como publicado pela fonte, já incorporando as alterações da Lei n.º 28/20, de 22 de Julho — confirmado pela redacção dos artigos 1.º, 2.º, 3.º, 5.º, 6.º, 8.º, 9.º, 10.º, 11.º e 16.º (reorganização dos Grupos de tributação A, B e C; matéria colectável do Grupo B a 70% do valor pago; taxa única de 15% no Grupo B, 30% no Grupo C e 6,5% sobre serviços sujeitos a retenção). A fonte apresenta o texto já unificado, sem marcas de \"Redacção dada\", pelo que não foram acrescentadas notas artigo a artigo. A Tabela de Taxas a que se refere o n.º 1 do artigo 16.º está ausente da página do Código na fonte e foi reproduzida no Anexo III a partir do artigo 3.º da Lei n.º 28/20, com nota de origem. Não reflecte alterações posteriores dos escalões introduzidas por leis do Orçamento Geral do Estado.",
 "sourceName": "Angolex",
